# Simulator-only metadata overlay for embedded test support frameworks.
name: BitwardenKit
include:
  - path: project-bwk.yml
targets:
  BitwardenSdkMocks:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bitwarden.disposable.bitwardensdkmocks
        INFOPLIST_FILE: BitwardenSdkMocks/Info.plist
    info:
      path: BitwardenSdkMocks/Info.plist
      properties:
        CFBundlePackageType: FMWK
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
  TestHelpers:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bitwarden.disposable.testhelpers
        INFOPLIST_FILE: TestHelpers/Info.plist
    info:
      path: TestHelpers/Info.plist
      properties:
        CFBundlePackageType: FMWK
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
  AuthenticatorBridgeKitMocks:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bitwarden.disposable.authenticatorbridgekitmocks
        INFOPLIST_FILE: AuthenticatorBridgeKit/MocksInfo.plist
    info:
      path: AuthenticatorBridgeKit/MocksInfo.plist
      properties:
        CFBundlePackageType: FMWK
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
  BitwardenKitMocks:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bitwarden.disposable.bitwardenkitmocks
        INFOPLIST_FILE: BitwardenKit/Application/Mocks/Support/Info.plist
    info:
      path: BitwardenKit/Application/Mocks/Support/Info.plist
      properties:
        CFBundlePackageType: FMWK
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
